<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">JavaScript 超长 ID 精度问题封面</title>
  <desc id="desc">超长数字 ID 在 JavaScript Number 中末位变化，字符串传输保持完整的技术示意图。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.55" stop-color="#172554"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="80" r="210" fill="#38bdf8" opacity="0.08"/>
  <circle cx="120" cy="600" r="260" fill="#a78bfa" opacity="0.09"/>
  <g opacity="0.16" fill="none" stroke="#93c5fd">
    <path d="M60 116H1140M60 514H1140"/>
    <path d="M90 80V550M1110 80V550"/>
  </g>

  <text x="72" y="90" fill="#7dd3fc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" font-weight="600" letter-spacing="2">TRACKING DATA QUALITY</text>
  <text x="72" y="154" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="46" font-weight="700">一个超长 ID，</text>
  <text x="72" y="212" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="46" font-weight="700">为什么到了前端就变了？</text>
  <text x="74" y="252" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="23">JavaScript 安全整数 · 接口契约 · 埋点证据链</text>

  <g filter="url(#shadow)">
    <rect x="72" y="310" width="470" height="190" rx="22" fill="#0f172a" stroke="#334155"/>
    <text x="104" y="354" fill="#94a3b8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19">JSON Number</text>
    <text x="104" y="405" fill="#f8fafc" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="27">9007199254740993</text>
    <path d="M104 431H506" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    <text x="104" y="470" fill="#fca5a5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22">→ 9007199254740992</text>
  </g>

  <path d="M566 405H638" stroke="url(#line)" stroke-width="6" stroke-linecap="round"/>
  <path d="M624 389L642 405 624 421" fill="none" stroke="#a78bfa" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="666" y="310" width="462" height="190" rx="22" fill="#0f172a" stroke="#334155"/>
    <text x="698" y="354" fill="#94a3b8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19">String ID</text>
    <text x="698" y="405" fill="#f8fafc" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="27">"9007199254740993"</text>
    <path d="M698 431H1092" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
    <text x="698" y="470" fill="#86efac" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22">✓ 原样进入埋点参数</text>
  </g>

  <text x="72" y="570" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20">从原始响应到 SDK 日志，逐层证明 ID 没有被悄悄改变</text>
</svg>
