<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">自动化用例通过了，为什么仍不能直接说功能没问题</title>
  <desc id="desc">绿色通过标记之后，仍需经过执行、断言、覆盖和业务结论四层判断</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#1b2940"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000" flood-opacity=".3"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="32" fill="url(#bg)"/>
  <circle cx="1070" cy="75" r="180" fill="#38bdf8" opacity=".06"/>
  <circle cx="92" cy="590" r="190" fill="#4ade80" opacity=".06"/>

  <text x="72" y="92" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="600" letter-spacing="3">AUTOMATION ≠ ASSURANCE</text>
  <text x="72" y="158" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="43" font-weight="800">自动化用例通过了</text>
  <text x="72" y="216" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="43" font-weight="800">为什么还不能说功能没问题？</text>

  <g transform="translate(72 276)" filter="url(#shadow)">
    <rect width="318" height="226" rx="24" fill="#0b1220" stroke="#334155" stroke-width="2"/>
    <circle cx="76" cy="80" r="42" fill="url(#green)"/>
    <path d="M56 80l14 15 27-31" fill="none" stroke="#062a23" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="136" y="91" fill="#4ade80" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="37" font-weight="800">PASS</text>
    <line x1="36" y1="139" x2="282" y2="139" stroke="#263449" stroke-width="2"/>
    <text x="36" y="177" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="21">脚本结束，不等于结论结束</text>
    <text x="36" y="207" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17">绿色结果也有证明范围</text>
  </g>

  <g transform="translate(444 276)" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
    <path d="M0 113h45" stroke="#475569" stroke-width="3" stroke-dasharray="7 8"/>
    <path d="M37 104l12 9-12 9" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(66 0)">
      <rect width="260" height="48" rx="13" fill="#17382f" stroke="#4ade80" stroke-width="2"/>
      <circle cx="28" cy="24" r="12" fill="#4ade80"/>
      <path d="M22 24l4 4 8-9" fill="none" stroke="#123027" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="53" y="31" fill="#dcfce7" font-size="22" font-weight="700">1. 执行成功</text>
    </g>
    <g transform="translate(66 59)">
      <rect width="310" height="48" rx="13" fill="#202f45" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="28" cy="24" r="12" fill="#38bdf8"/>
      <text x="24" y="30" fill="#0c2435" font-size="17" font-weight="800">2</text>
      <text x="53" y="31" fill="#e0f2fe" font-size="22" font-weight="700">断言有效</text>
      <text x="196" y="31" fill="#7dd3fc" font-size="16">证明了什么？</text>
    </g>
    <g transform="translate(66 118)">
      <rect width="360" height="48" rx="13" fill="#302b43" stroke="#a78bfa" stroke-width="2"/>
      <circle cx="28" cy="24" r="12" fill="#a78bfa"/>
      <text x="24" y="30" fill="#251b3b" font-size="17" font-weight="800">3</text>
      <text x="53" y="31" fill="#ede9fe" font-size="22" font-weight="700">场景覆盖</text>
      <text x="196" y="31" fill="#c4b5fd" font-size="16">遗漏了什么？</text>
    </g>
    <g transform="translate(66 177)">
      <rect width="410" height="48" rx="13" fill="#3b3021" stroke="#fbbf24" stroke-width="2"/>
      <circle cx="28" cy="24" r="12" fill="#fbbf24"/>
      <text x="24" y="30" fill="#3b2a08" font-size="17" font-weight="800">4</text>
      <text x="53" y="31" fill="#fef3c7" font-size="22" font-weight="700">业务结论</text>
      <text x="196" y="31" fill="#fde68a" font-size="16">能支持哪个决策？</text>
    </g>
  </g>

  <text x="72" y="570" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="21">通过是证据，不是“没有缺陷”的证书</text>
  <text x="1128" y="570" text-anchor="end" fill="#64748b" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17">LINN · TESTING NOTES</text>
</svg>
