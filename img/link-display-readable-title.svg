<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">让链接显示成可读文字</title>
  <desc id="desc">两个场景：平台内外部链接抓网页标题，企业微信通知从 text 消息升级为 markdown 消息让链接显示成文字。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#0f1430"/>
      <stop offset="1" stop-color="#232b57"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0v6l9-3z" fill="#8b9cff"/>
    </marker>
  </defs>
  <rect width="1200" height="560" rx="28" fill="url(#bg)"/>
  <text x="60" y="78" fill="#f5f3ff" font-family="sans-serif" font-size="34" font-weight="700">让链接显示成可读文字</text>
  <text x="60" y="120" fill="#aeb9ed" font-family="sans-serif" font-size="20">平台抓网页标题 · 企业微信通知 markdown 化</text>

  <g font-family="sans-serif">
    <!-- 场景一：平台内 -->
    <rect x="60" y="165" width="520" height="230" rx="20" fill="#20285a" stroke="#6677d9"/>
    <text x="320" y="205" fill="#fff" text-anchor="middle" font-size="22" font-weight="700">场景一 · 平台内外部链接</text>
    <rect x="95" y="230" width="180" height="50" rx="8" fill="#313b75"/>
    <text x="185" y="261" fill="#dce2ff" text-anchor="middle" font-size="16" font-family="monospace">https://…long-url</text>
    <path d="M275 255h45" stroke="#8b9cff" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="330" y="230" width="180" height="50" rx="8" fill="#244e4e" stroke="#55d6b4"/>
    <text x="420" y="261" fill="#b9eadc" text-anchor="middle" font-size="16">一篇可读的文章标题</text>
    <text x="320" y="330" fill="#8b9cff" text-anchor="middle" font-size="17">手动 &gt; 自动抓取 &gt; 网址（SSRF 防护）</text>
    <text x="320" y="362" fill="#8b9cff" text-anchor="middle" font-size="16">异步解析 · 先显示网址后替换</text>

    <!-- 场景二：企业微信 -->
    <rect x="620" y="165" width="520" height="230" rx="20" fill="#20285a" stroke="#6677d9"/>
    <text x="880" y="205" fill="#fff" text-anchor="middle" font-size="22" font-weight="700">场景二 · 企业微信通知</text>
    <rect x="655" y="230" width="170" height="50" rx="8" fill="#313b75"/>
    <text x="740" y="256" fill="#dce2ff" text-anchor="middle" font-size="16">text 消息</text>
    <text x="740" y="276" fill="#8b9cff" text-anchor="middle" font-size="13">裸网址</text>
    <path d="M825 255h45" stroke="#8b9cff" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="880" y="230" width="190" height="50" rx="8" fill="#244e4e" stroke="#55d6b4"/>
    <text x="975" y="256" fill="#b9eadc" text-anchor="middle" font-size="16">markdown 消息</text>
    <text x="975" y="276" fill="#b9eadc" text-anchor="middle" font-size="13">[标题](链接)</text>
    <text x="880" y="330" fill="#8b9cff" text-anchor="middle" font-size="17">[【缺陷】#123 标题](链接)</text>
    <text x="880" y="362" fill="#8b9cff" text-anchor="middle" font-size="16">@ 依赖 userid（&lt;@userid&gt;）</text>

    <!-- 底部 -->
    <rect x="60" y="430" width="1080" height="66" rx="16" fill="#171d43" stroke="#4c5794"/>
    <text x="600" y="468" fill="#cbd2ff" text-anchor="middle" font-size="18">两个场景，同一个诉求：链接应该显示成人类可读的文字，而不是 URL 本身</text>
  </g>
</svg>
