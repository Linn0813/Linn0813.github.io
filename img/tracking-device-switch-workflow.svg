<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">埋点验收换机处理流程</title>
  <desc id="desc">从冻结旧设备现场到最终汇总一致性检查的七步流程</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0369a1"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1200" height="720" rx="24" fill="#f1f5f9"/>
  <rect x="0" y="0" width="1200" height="112" rx="24" fill="url(#header)"/>
  <rect x="0" y="82" width="1200" height="30" fill="url(#header)"/>
  <text x="58" y="53" fill="#ffffff" font-size="31" font-family="Arial, PingFang SC, sans-serif" font-weight="700">换机后，不延续旧窗口；重建一个可追溯的证据段</text>
  <text x="58" y="87" fill="#dbeafe" font-size="18" font-family="Arial, PingFang SC, sans-serif">同一运行是否继续，取决于规格、平台、构建、环境和采集链路是否一致</text>

  <g font-family="Arial, PingFang SC, sans-serif" filter="url(#shadow)">
    <rect x="55" y="155" width="300" height="126" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="91" cy="193" r="20" fill="#0ea5e9"/>
    <text x="91" y="200" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">1</text>
    <text x="126" y="198" fill="#0f172a" font-size="22" font-weight="700">冻结旧设备现场</text>
    <text x="80" y="235" fill="#475569" font-size="17">停止监听、保存原始文件</text>
    <text x="80" y="261" fill="#475569" font-size="17">记录停止时间与当前用例</text>

    <rect x="450" y="155" width="300" height="126" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="486" cy="193" r="20" fill="#0ea5e9"/>
    <text x="486" y="200" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">2</text>
    <text x="521" y="198" fill="#0f172a" font-size="22" font-weight="700">判断是否拆新运行</text>
    <text x="475" y="235" fill="#475569" font-size="17">规格 / 平台 / 构建 / 环境</text>
    <text x="475" y="261" fill="#475569" font-size="17">任一关键身份变化则拆分</text>

    <rect x="845" y="155" width="300" height="126" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="881" cy="193" r="20" fill="#0ea5e9"/>
    <text x="881" y="200" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">3</text>
    <text x="916" y="198" fill="#0f172a" font-size="22" font-weight="700">登记设备切换</text>
    <text x="870" y="235" fill="#475569" font-size="17">新设备身份与切换原因</text>
    <text x="870" y="261" fill="#475569" font-size="17">创建独立证据段 SEG-02</text>

    <rect x="845" y="346" width="300" height="126" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="881" cy="384" r="20" fill="#10b981"/>
    <text x="881" y="391" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">4</text>
    <text x="916" y="389" fill="#0f172a" font-size="22" font-weight="700">重建采集窗口</text>
    <text x="870" y="426" fill="#475569" font-size="17">重新启用调试模式</text>
    <text x="870" y="452" fill="#475569" font-size="17">清日志、记起止时间</text>

    <rect x="450" y="346" width="300" height="126" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="486" cy="384" r="20" fill="#10b981"/>
    <text x="486" y="391" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">5</text>
    <text x="521" y="389" fill="#0f172a" font-size="22" font-weight="700">先做最小冒烟</text>
    <text x="475" y="426" fill="#475569" font-size="17">动作 → SDK → DebugView</text>
    <text x="475" y="452" fill="#475569" font-size="17">先证明新链路可用</text>

    <rect x="55" y="346" width="300" height="126" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="91" cy="384" r="20" fill="#10b981"/>
    <text x="91" y="391" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">6</text>
    <text x="126" y="389" fill="#0f172a" font-size="22" font-weight="700">重跑受影响用例</text>
    <text x="80" y="426" fill="#475569" font-size="17">不完整证据全部重采</text>
    <text x="80" y="452" fill="#475569" font-size="17">结论引用 evidence ID</text>

    <rect x="290" y="552" width="620" height="112" rx="20" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
    <circle cx="336" cy="593" r="22" fill="#047857"/>
    <text x="336" y="601" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">7</text>
    <text x="378" y="599" fill="#064e3b" font-size="24" font-weight="700">重新生成权威汇总</text>
    <text x="378" y="634" fill="#166534" font-size="18">矩阵、证据索引、结论历史和最终报告必须一致</text>
  </g>

  <g fill="none" stroke="#64748b" stroke-width="3">
    <path d="M355 218 H430"/>
    <path d="M750 218 H825"/>
    <path d="M995 281 V326"/>
    <path d="M845 409 H770"/>
    <path d="M450 409 H375"/>
    <path d="M205 472 V510 C205 530 225 608 270 608"/>
  </g>
  <g fill="#64748b">
    <polygon points="424,210 440,218 424,226"/>
    <polygon points="819,210 835,218 819,226"/>
    <polygon points="987,320 995,336 1003,320"/>
    <polygon points="776,401 760,409 776,417"/>
    <polygon points="381,401 365,409 381,417"/>
    <polygon points="264,600 280,608 264,616"/>
  </g>
</svg>
