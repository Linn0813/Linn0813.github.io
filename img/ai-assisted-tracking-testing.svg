<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AI 协助埋点测试</title>
  <desc id="desc">从埋点文档、真机操作、SDK 日志到 Firebase DebugView 和验收报告的证据链</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101b3b"/>
      <stop offset="0.52" stop-color="#182a55"/>
      <stop offset="1" stop-color="#123c4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1390" cy="120" r="250" fill="#38bdf8" opacity="0.08"/>
  <circle cx="150" cy="805" r="310" fill="#2dd4bf" opacity="0.07"/>
  <g fill="none" stroke="#93c5fd" stroke-opacity="0.13">
    <path d="M0 155H1600M0 310H1600M0 465H1600M0 620H1600M0 775H1600"/>
    <path d="M180 0V900M420 0V900M660 0V900M900 0V900M1140 0V900M1380 0V900"/>
  </g>
  <text x="130" y="175" fill="#bae6fd" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="34" font-weight="650" letter-spacing="5">AI TESTING · ANALYTICS QUALITY</text>
  <text x="130" y="300" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="72" font-weight="800">如何让 AI 协助埋点测试</text>
  <rect x="132" y="343" width="890" height="8" rx="4" fill="url(#accent)"/>
  <text x="130" y="425" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="38">从埋点文档到 Firebase 验收报告</text>
  <g filter="url(#shadow)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <g transform="translate(130 560)">
      <rect width="235" height="132" rx="24" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
      <text x="117.5" y="57" text-anchor="middle" fill="#dbeafe" font-size="29" font-weight="700">埋点文档</text>
      <text x="117.5" y="94" text-anchor="middle" fill="#93c5fd" font-size="21">SPEC</text>
    </g>
    <g transform="translate(432 560)">
      <rect width="235" height="132" rx="24" fill="#15314b" stroke="#38bdf8" stroke-width="2"/>
      <text x="117.5" y="57" text-anchor="middle" fill="#e0f2fe" font-size="29" font-weight="700">真机操作</text>
      <text x="117.5" y="94" text-anchor="middle" fill="#7dd3fc" font-size="21">ACTION</text>
    </g>
    <g transform="translate(734 560)">
      <rect width="235" height="132" rx="24" fill="#12394a" stroke="#2dd4bf" stroke-width="2"/>
      <text x="117.5" y="57" text-anchor="middle" fill="#ccfbf1" font-size="29" font-weight="700">SDK 日志</text>
      <text x="117.5" y="94" text-anchor="middle" fill="#5eead4" font-size="21">EVIDENCE</text>
    </g>
    <g transform="translate(1036 560)">
      <rect width="235" height="132" rx="24" fill="#17423f" stroke="#34d399" stroke-width="2"/>
      <text x="117.5" y="57" text-anchor="middle" fill="#d1fae5" font-size="29" font-weight="700">DebugView</text>
      <text x="117.5" y="94" text-anchor="middle" fill="#6ee7b7" font-size="21">RECEIVED</text>
    </g>
    <g transform="translate(1338 560)">
      <rect width="150" height="132" rx="24" fill="#1c463f" stroke="#a7f3d0" stroke-width="2"/>
      <text x="75" y="57" text-anchor="middle" fill="#ecfdf5" font-size="26" font-weight="700">验收表</text>
      <text x="75" y="94" text-anchor="middle" fill="#a7f3d0" font-size="19">REPORT</text>
    </g>
  </g>
  <g fill="none" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M378 626h39l-14-14m14 14-14 14"/>
    <path d="M680 626h39l-14-14m14 14-14 14"/>
    <path d="M982 626h39l-14-14m14 14-14 14"/>
    <path d="M1284 626h39l-14-14m14 14-14 14"/>
  </g>
  <rect x="130" y="760" width="1358" height="2" fill="#94a3b8" opacity="0.35"/>
  <text x="130" y="825" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="26">调用成功 ≠ SDK 接收成功 ≠ 服务端可见 ≠ 分析口径正确</text>
</svg>
