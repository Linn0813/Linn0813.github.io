<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">排行榜测试数据设计</title>
  <desc id="desc">阈值、并列、Top N 和邀请关系构成的排行榜测试场景封面</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10243f"/>
      <stop offset="0.55" stop-color="#173d5d"/>
      <stop offset="1" stop-color="#116466"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#f4a261"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#071421" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1600" height="900" rx="42" fill="url(#bg)"/>
  <circle cx="1420" cy="120" r="220" fill="#55d6be" opacity="0.08"/>
  <circle cx="170" cy="820" r="250" fill="#ffd166" opacity="0.07"/>

  <g transform="translate(105 115)">
    <rect width="610" height="670" rx="34" fill="#f7fbff" opacity="0.98" filter="url(#shadow)"/>
    <text x="56" y="82" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#17324d">RANKING TEST MATRIX</text>
    <line x1="56" y1="112" x2="554" y2="112" stroke="#d6e4ee" stroke-width="3"/>

    <g font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" fill="#17324d">
      <circle cx="86" cy="174" r="24" fill="url(#gold)"/><text x="78" y="184" font-weight="700">1</text>
      <rect x="135" y="153" width="352" height="42" rx="21" fill="#1f7a7a"/><text x="157" y="182" fill="#fff">阈值 T + 1</text><text x="515" y="182" text-anchor="end" font-weight="700">6</text>

      <circle cx="86" cy="248" r="24" fill="#c7d8e5"/><text x="78" y="258" font-weight="700">2</text>
      <rect x="135" y="227" width="294" height="42" rx="21" fill="#3f8f8d"/><text x="157" y="256" fill="#fff">阈值 T</text><text x="515" y="256" text-anchor="end" font-weight="700">5</text>

      <circle cx="86" cy="322" r="24" fill="#c7d8e5"/><text x="78" y="332" font-weight="700">3</text>
      <rect x="135" y="301" width="238" height="42" rx="21" fill="#68aaa3"/><text x="157" y="330" fill="#fff">阈值 T - 1</text><text x="515" y="330" text-anchor="end" font-weight="700">4</text>
    </g>

    <g transform="translate(55 405)" font-family="PingFang SC, Microsoft YaHei, sans-serif">
      <rect width="500" height="195" rx="24" fill="#eaf3f6"/>
      <text x="28" y="48" font-size="24" font-weight="700" fill="#17324d">边界场景</text>
      <g font-size="21" fill="#32516b">
        <text x="28" y="91">✓ 并列排序稳定</text>
        <text x="270" y="91">✓ Top N / N+1</text>
        <text x="28" y="132">✓ 0 分与未参与</text>
        <text x="270" y="132">✓ 邀请关系链</text>
        <text x="28" y="173">✓ 追平与反超</text>
        <text x="270" y="173">✓ 三层证据</text>
      </g>
    </g>
  </g>

  <g transform="translate(800 178)" font-family="PingFang SC, Microsoft YaHei, sans-serif">
    <text x="0" y="0" font-size="34" font-weight="600" fill="#8fe3d4">测试设计实战</text>
    <text x="0" y="86" font-size="66" font-weight="800" fill="#ffffff">排行榜测试数据</text>
    <text x="0" y="164" font-size="66" font-weight="800" fill="#ffffff">到底应该怎么造？</text>
    <text x="0" y="242" font-size="31" fill="#d7eef1">阈值 · 并列 · Top N · 邀请关系</text>

    <g transform="translate(0 330)">
      <line x1="38" y1="42" x2="145" y2="42" stroke="#8fe3d4" stroke-width="5"/>
      <line x1="145" y1="42" x2="245" y2="112" stroke="#8fe3d4" stroke-width="5"/>
      <line x1="145" y1="42" x2="245" y2="-28" stroke="#8fe3d4" stroke-width="5"/>
      <circle cx="38" cy="42" r="30" fill="#ffd166"/>
      <circle cx="145" cy="42" r="30" fill="#55d6be"/>
      <circle cx="245" cy="-28" r="30" fill="#f4a261"/>
      <circle cx="245" cy="112" r="30" fill="#83c5be"/>
      <text x="300" y="0" font-size="26" fill="#fff">用关系图验证邀请计数</text>
      <text x="300" y="54" font-size="26" fill="#fff">用状态变化验证排序切换</text>
      <text x="300" y="108" font-size="26" fill="#fff">用证据链确认真实结果</text>
    </g>
  </g>
</svg>
