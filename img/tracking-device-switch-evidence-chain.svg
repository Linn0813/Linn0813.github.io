<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">埋点验收中途换手机，怎样保证证据链不断</title>
  <desc id="desc">两台测试手机通过独立采集段连接到同一个运行编号、证据索引和验收报告</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="28" fill="url(#bg)"/>
  <circle cx="1100" cy="88" r="125" fill="#38bdf8" opacity="0.08"/>
  <circle cx="90" cy="570" r="150" fill="#34d399" opacity="0.07"/>

  <text x="70" y="88" fill="#e2e8f0" font-size="25" font-family="Arial, PingFang SC, sans-serif" font-weight="600">移动端埋点验收实战</text>
  <text x="70" y="145" fill="#ffffff" font-size="43" font-family="Arial, PingFang SC, sans-serif" font-weight="700">中途换手机，证据链怎样不断？</text>
  <text x="70" y="187" fill="#94a3b8" font-size="21" font-family="Arial, PingFang SC, sans-serif">连续的是验收任务，不是跨设备的一段日志</text>

  <g filter="url(#shadow)">
    <rect x="75" y="252" width="218" height="266" rx="34" fill="#0f172a" stroke="#475569" stroke-width="3"/>
    <rect x="91" y="286" width="186" height="188" rx="13" fill="#172554"/>
    <circle cx="184" cy="493" r="9" fill="#64748b"/>
    <text x="184" y="326" text-anchor="middle" fill="#bae6fd" font-size="22" font-family="Arial, PingFang SC, sans-serif" font-weight="700">设备 A</text>
    <text x="184" y="365" text-anchor="middle" fill="#94a3b8" font-size="17" font-family="Arial, PingFang SC, sans-serif">停止旧采集</text>
    <text x="184" y="396" text-anchor="middle" fill="#94a3b8" font-size="17" font-family="Arial, PingFang SC, sans-serif">保存原始证据</text>
    <rect x="120" y="426" width="128" height="26" rx="13" fill="#334155"/>
    <text x="184" y="445" text-anchor="middle" fill="#e2e8f0" font-size="14" font-family="Arial, PingFang SC, sans-serif">采集段 SEG-01</text>

    <rect x="907" y="252" width="218" height="266" rx="34" fill="#0f172a" stroke="#34d399" stroke-width="3"/>
    <rect x="923" y="286" width="186" height="188" rx="13" fill="#064e3b"/>
    <circle cx="1016" cy="493" r="9" fill="#34d399"/>
    <text x="1016" y="326" text-anchor="middle" fill="#a7f3d0" font-size="22" font-family="Arial, PingFang SC, sans-serif" font-weight="700">设备 B</text>
    <text x="1016" y="365" text-anchor="middle" fill="#d1fae5" font-size="17" font-family="Arial, PingFang SC, sans-serif">核对构建与环境</text>
    <text x="1016" y="396" text-anchor="middle" fill="#d1fae5" font-size="17" font-family="Arial, PingFang SC, sans-serif">重建正式窗口</text>
    <rect x="952" y="426" width="128" height="26" rx="13" fill="#065f46"/>
    <text x="1016" y="445" text-anchor="middle" fill="#ecfdf5" font-size="14" font-family="Arial, PingFang SC, sans-serif">采集段 SEG-02</text>
  </g>

  <path d="M310 360 C370 360 375 320 430 320" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="9 8"/>
  <polygon points="428,312 445,320 428,328" fill="#38bdf8"/>
  <path d="M755 320 C815 320 825 360 890 360" fill="none" stroke="#34d399" stroke-width="4"/>
  <polygon points="885,352 902,360 885,368" fill="#34d399"/>

  <g filter="url(#shadow)">
    <rect x="430" y="252" width="340" height="266" rx="24" fill="#f8fafc"/>
    <rect x="455" y="278" width="290" height="55" rx="13" fill="url(#accent)"/>
    <text x="600" y="313" text-anchor="middle" fill="#082f49" font-size="21" font-family="Arial, PingFang SC, sans-serif" font-weight="700">同一个 RUN-ID</text>
    <rect x="467" y="356" width="266" height="42" rx="10" fill="#e0f2fe"/>
    <text x="600" y="383" text-anchor="middle" fill="#075985" font-size="17" font-family="Arial, PingFang SC, sans-serif">规格 + 验收矩阵</text>
    <rect x="467" y="410" width="266" height="42" rx="10" fill="#dcfce7"/>
    <text x="600" y="437" text-anchor="middle" fill="#166534" font-size="17" font-family="Arial, PingFang SC, sans-serif">证据索引 + SHA-256</text>
    <rect x="467" y="464" width="266" height="42" rx="10" fill="#ede9fe"/>
    <text x="600" y="491" text-anchor="middle" fill="#5b21b6" font-size="17" font-family="Arial, PingFang SC, sans-serif">结论历史 + 权威报告</text>
  </g>

  <rect x="70" y="560" width="1060" height="2" fill="#334155"/>
  <text x="70" y="596" fill="#cbd5e1" font-size="18" font-family="Arial, PingFang SC, sans-serif">设备可切换 · 采集窗口必须隔离 · 每条结论必须能回到原始证据</text>
</svg>
